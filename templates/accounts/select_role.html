<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Select Role - FreelanceConnect</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Inter", sans-serif;
            }

            @keyframes subtle-float {
                0%,
                100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-10px);
                }
            }
            @keyframes fade-in-up {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .animate-float {
                animation: subtle-float 6s ease-in-out infinite;
            }
            .animate-float-delayed {
                animation: subtle-float 8s ease-in-out infinite 1s;
            }
            .animate-enter {
                animation: fade-in-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }

            /* Custom Radio Styling */
            .role-radio:checked + .role-content {
                border-color: #4f46e5;
                background-color: #f5f7ff;
                box-shadow:
                    0 4px 6px -1px rgba(79, 70, 229, 0.1),
                    0 2px 4px -1px rgba(79, 70, 229, 0.06);
            }
            .role-radio:checked + .role-content .role-icon {
                background-color: #4f46e5;
                color: white;
                transform: scale(1.1);
            }
            .role-radio:checked + .role-content .check-icon {
                opacity: 1;
                transform: scale(1);
            }
        </style>
    </head>
    <body class="bg-gray-50 text-slate-800 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
        <!-- Background Decoration -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
            <svg
                class="absolute top-0 left-0 w-96 h-96 text-gray-200/50 -translate-x-1/2 -translate-y-1/2 animate-float"
                viewBox="0 0 100 100"
                fill="currentColor"
            >
                <circle cx="50" cy="50" r="50" />
            </svg>
            <svg
                class="absolute bottom-0 right-0 w-[500px] h-[500px] text-indigo-50/50 translate-x-1/3 translate-y-1/3 animate-float-delayed"
                viewBox="0 0 100 100"
                fill="currentColor"
            >
                <rect x="0" y="0" width="100" height="100" rx="20" />
            </svg>
        </div>

        <!-- Main Container -->
        <div
            class="relative z-10 w-full max-w-2xl bg-white rounded-sm shadow-sm border border-black/5 p-6 md:p-8 animate-enter"
        >
            <div class="text-center mb-8">
                <h2 class="text-xl md:text-2xl font-bold text-slate-900 tracking-tight">Join FreelanceConnect</h2>
                <p class="mt-2 text-sm text-slate-500">How would you like to use our platform today?</p>
            </div>

            <form action="{% url 'accounts:role' %}" method="post" class="space-y-6">
                {% csrf_token %}

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Client Option -->
                    <label class="cursor-pointer group relative block">
                        <input type="radio" name="role" value="client" class="role-radio hidden" required />
                        <div
                            class="role-content border border-slate-200 rounded-sm p-6 transition-all duration-300 h-full flex flex-col items-center text-center hover:border-indigo-300 hover:shadow-sm bg-white relative"
                        >
                            <!-- Selected Checkmark -->
                            <div
                                class="check-icon absolute top-3 right-3 text-indigo-600 opacity-0 transform scale-75 transition-all duration-300"
                            >
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                    <path
                                        fill-rule="evenodd"
                                        d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                                        clip-rule="evenodd"
                                    />
                                </svg>
                            </div>

                            <div
                                class="role-icon w-12 h-12 rounded-full bg-slate-50 text-slate-500 flex items-center justify-center mb-4 transition-all duration-300"
                            >
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="1.5"
                                        d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                                    ></path>
                                </svg>
                            </div>
                            <h3 class="text-sm font-bold text-slate-800 mb-1">I'm a Client</h3>
                            <p class="text-xs text-slate-500 leading-relaxed">I want to post jobs & hire talent.</p>
                        </div>
                    </label>

                    <!-- Freelancer Option -->
                    <label class="cursor-pointer group relative block">
                        <input type="radio" name="role" value="freelancer" class="role-radio hidden" required />
                        <div
                            class="role-content border border-slate-200 rounded-sm p-6 transition-all duration-300 h-full flex flex-col items-center text-center hover:border-indigo-300 hover:shadow-sm bg-white relative"
                        >
                            <!-- Selected Checkmark -->
                            <div
                                class="check-icon absolute top-3 right-3 text-indigo-600 opacity-0 transform scale-75 transition-all duration-300"
                            >
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                    <path
                                        fill-rule="evenodd"
                                        d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                                        clip-rule="evenodd"
                                    />
                                </svg>
                            </div>

                            <div
                                class="role-icon w-12 h-12 rounded-full bg-slate-50 text-slate-500 flex items-center justify-center mb-4 transition-all duration-300"
                            >
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="1.5"
                                        d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                                    ></path>
                                </svg>
                            </div>
                            <h3 class="text-sm font-bold text-slate-800 mb-1">I'm a Freelancer</h3>
                            <p class="text-xs text-slate-500 leading-relaxed">I want to find freelance projects.</p>
                        </div>
                    </label>
                </div>

                <div class="pt-4">
                    <button
                        type="submit"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-sm shadow-sm text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all transform hover:-translate-y-0.5"
                    >
                        Create Account
                    </button>
                </div>
            </form>

            <div class="text-center mt-6">
                <p class="text-xs text-slate-500">
                    Already have an account?
                    <a
                        href="{% url 'accounts:signin' %}"
                        class="font-bold text-indigo-600 hover:text-indigo-500 transition-colors hover:underline"
                        >Sign in</a
                    >
                </p>
            </div>
        </div>
    </body>
</html>
