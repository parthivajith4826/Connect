{% extends "freelancer/freelancer_base.html" %} {% block subscriptions %}

<div class="flex-1 flex items-center justify-center px-4 py-20">
    <div class="w-full max-w-md bg-[#1d1d1f] rounded-3xl p-10 shadow-2xl border border-gray-800 text-center">
        <!-- LOADING ICON -->
        <div class="flex items-center justify-center mb-6">
            <div class="w-16 h-16 rounded-full bg-blue-500/10 flex items-center justify-center">
                <svg
                    class="animate-spin w-8 h-8 text-blue-500"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                >
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path
                        class="opacity-75"
                        fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                    ></path>
                </svg>
            </div>
        </div>

        <!-- TITLE -->
        <h2 class="text-2xl font-semibold text-white mb-2">Processing Payment...</h2>

        <!-- MESSAGE -->
        <p class="text-gray-400 text-sm leading-relaxed mb-8">
            Please wait while we confirm your transaction. <br />
            Do not refresh or close this page.
        </p>

        <!-- FOOTER NOTE -->
        <p class="text-[11px] text-gray-500 mt-6 animate-pulse">Verifying secure payment 🔒</p>
    </div>
</div>

<script>
    setTimeout(() => {
        location.reload();
    }, 3000);
</script>

{% endblock %}
