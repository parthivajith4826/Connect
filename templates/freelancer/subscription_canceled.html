{% extends "freelancer/freelancer_base.html" %} {% block subscriptions %}

<div class="flex-1 flex items-center justify-center px-4 py-20">
    <div class="w-full max-w-md bg-[#1d1d1f] rounded-3xl p-10 shadow-2xl border border-gray-800 text-center">
        <!-- CANCELED ICON -->
        <div class="flex items-center justify-center mb-6">
            <div class="w-16 h-16 rounded-full bg-yellow-500/10 flex items-center justify-center">
                <svg class="w-8 h-8 text-yellow-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                    />
                </svg>
            </div>
        </div>

        <!-- TITLE -->
        <h2 class="text-2xl font-semibold text-white mb-2">Payment Canceled</h2>

        <!-- MESSAGE -->
        <p class="text-gray-400 text-sm leading-relaxed mb-8">
            You have canceled the payment process. No charges were made to your account.
        </p>

        <!-- ACTION BUTTON -->
        <a
            href="{% url 'freelancer:subscriptions' %}"
            class="inline-flex items-center justify-center w-full py-3 rounded-2xl bg-gray-700 text-white font-semibold text-sm hover:bg-gray-600 transition shadow-lg shadow-gray-700/30"
        >
            Back to Plans
        </a>

        <!-- FOOTER NOTE -->
        <p class="text-[11px] text-gray-500 mt-6">You can subscribe anytime you're ready.</p>
    </div>
</div>

{% endblock %}
