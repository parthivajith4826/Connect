{% extends "freelancer\freelancer_base.html" %} {% block find_work %}
<style>
    body {
        font-family: "Inter", sans-serif;
    }
    a {
        text-decoration: none !important;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
    }

    /* Custom Animations */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translate3d(0, 20px, 0);
        }
        to {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }
    }

    .animate-fade-in-up {
        animation: fadeInUp 0.8s ease-out forwards;
    }

    .delay-100 {
        animation-delay: 0.1s;
    }
    .delay-200 {
        animation-delay: 0.2s;
    }
    .delay-300 {
        animation-delay: 0.3s;
    }
</style>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto h-screen bg-[#f5f5f7]">
    <!-- Top Header with Search and Filters -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-20">
        <!-- Search Bar Row -->
        <div class="px-8 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold text-[#1d1d1f]">Find Work</h1>
            <div class="flex-1 max-w-2xl mx-8 relative">
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg
                            class="h-5 w-5 text-gray-400 group-focus-within:text-[#0071e3] transition-colors"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                            ></path>
                        </svg>
                    </div>
                    <input
                        type="text"
                        class="block w-full pl-11 pr-4 py-3 bg-gray-50 border border-transparent rounded-full text-sm placeholder-gray-500 focus:bg-white focus:border-[#0071e3] focus:ring-1 focus:ring-[#0071e3] focus:outline-none transition-all shadow-sm"
                        placeholder="Search by category, skill, or keyword..."
                    />
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <button class="p-1 text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-100">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12"
                                ></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="w-20"></div>
            <!-- Spacer balance -->
        </div>

        <!-- Filters Row -->
        <div class="px-8 pb-4 flex items-center gap-3 overflow-x-auto no-scrollbar">
            <!-- Category Filter -->
            <div class="relative group">
                <button
                    class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-full text-sm font-medium text-gray-700 hover:border-[#0071e3] hover:text-[#0071e3] transition-colors"
                >
                    Category
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
            </div>

            <!-- Skills Filter -->
            <div class="relative group">
                <button
                    class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-full text-sm font-medium text-gray-700 hover:border-[#0071e3] hover:text-[#0071e3] transition-colors"
                >
                    Skills
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
            </div>

            <!-- Budget Filter -->
            <div class="relative group">
                <button
                    class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-full text-sm font-medium text-gray-700 hover:border-[#0071e3] hover:text-[#0071e3] transition-colors"
                >
                    Price
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
            </div>

            <!-- Timeline Filter -->
            <div class="relative group">
                <button
                    class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-full text-sm font-medium text-gray-700 hover:border-[#0071e3] hover:text-[#0071e3] transition-colors"
                >
                    Timeline
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
            </div>

            <div class="h-6 w-px bg-gray-300 mx-2"></div>

            <!-- Quick Filters (Pills) -->
            <button
                class="px-4 py-2 rounded-full bg-gray-100 text-sm font-medium text-gray-600 hover:bg-gray-200 transition-colors"
            >
                Newest
            </button>
            <button
                class="px-4 py-2 rounded-full bg-gray-100 text-sm font-medium text-gray-600 hover:bg-gray-200 transition-colors"
            >
                Best Match
            </button>
        </div>
    </header>

    <!-- Hero Section (Content Placeholder) -->
    <div class="flex-1 flex items-center justify-center p-8 min-h-[calc(100vh-12rem)]">
        <div class="text-center max-w-2xl mx-auto space-y-8 animate-fade-in-up">
            <!-- Inspirational Quote/Heading -->
            <div class="space-y-4">
                <h2 class="text-4xl md:text-5xl font-bold text-[#1d1d1f] tracking-tight leading-tight">
                    Find your next <br />
                    <span class="bg-clip-text text-transparent bg-gradient-to-r from-[#0071e3] to-[#2997ff]">
                        masterpiece.
                    </span>
                </h2>
                <p
                    class="text-lg text-slate-500 font-medium max-w-lg mx-auto delay-100 animate-fade-in-up opacity-0"
                    style="animation-fill-mode: forwards"
                >
                    Explore thousands of opportunities, connect with top clients, and take your career to new heights.
                </p>
            </div>

            <!-- Minimal Illustration/Icon -->
            <div
                class="relative w-64 h-64 mx-auto delay-200 animate-fade-in-up opacity-0"
                style="animation-fill-mode: forwards"
            >
                <div class="absolute inset-0 bg-blue-50 rounded-full animate-pulse opacity-50 blur-3xl"></div>
                <img
                    src="https://cdni.iconscout.com/illustration/premium/thumb/job-search-3428236-2902695.png"
                    alt="Search Illustration"
                    class="relative z-10 w-full h-full object-contain filter drop-shadow-xl hover:scale-105 transition-transform duration-500"
                />
            </div>

            <!-- CTA Hint -->
            <div class="delay-300 animate-fade-in-up opacity-0" style="animation-fill-mode: forwards">
                <p class="text-sm text-slate-400 font-medium uppercase tracking-widest">Start by searching above</p>
                <div class="mt-4 mx-auto w-1 h-12 bg-gradient-to-b from-slate-200 to-transparent rounded-full"></div>
            </div>
        </div>
    </div>
</main>
<script>
    // Simple script to mimic "search" functionality
    const searchInput = document.querySelector('input[type="text"]');
    searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            // Redirect to the listing page on Enter
            window.location.href = "find_work.html";
        }
    });
</script>
{% endblock find_work %}
