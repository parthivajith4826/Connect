{% extends "freelancer/freelancer_base.html" %} {% block subscriptions %}

<div class="flex-1 flex items-center justify-center px-4 py-20">
    <div class="w-full max-w-md bg-[#1d1d1f] rounded-sm p-10 shadow-2xl border border-gray-800 text-center">
        <!-- FAILED ICON -->
        <div class="flex items-center justify-center mb-6">
            <div class="w-16 h-16 rounded-full bg-red-500/10 flex items-center justify-center">
                <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </div>
        </div>

        <!-- TITLE -->
        <h2 class="text-2xl font-semibold text-white mb-2">Payment Failed</h2>

        <!-- MESSAGE -->
        <p class="text-gray-400 text-sm leading-relaxed mb-8">
            Your payment could not be completed. Please check your details or try a different payment method.
        </p>

        <!-- ACTION BUTTON -->
        <a
            href="{% url 'freelancer:subscriptions' %}"
            class="inline-flex items-center justify-center w-full py-3 rounded-sm bg-red-500 text-white font-semibold text-sm hover:bg-red-400 transition shadow-sm shadow-red-500/30"
        >
            Try Again
        </a>

        <!-- FOOTER NOTE -->
        <p class="text-[11px] text-gray-500 mt-6">Need help? Contact support.</p>
    </div>
</div>

{% endblock %}
