<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Inactive - FreelanceConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>

<body class="bg-gray-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

<div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 md:p-10 space-y-8 text-center">

    <!-- Icon -->
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-50 text-red-600">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M18.364 5.636l-12.728 12.728M5.636 5.636l12.728 12.728"/>
        </svg>
    </div>

    <div class="space-y-2">
        <h1 class="text-3xl font-extrabold text-slate-900">
            Account Inactive
        </h1>
        <p class="text-slate-500 font-medium text-lg">
            Your account is currently disabled
        </p>
    </div>

    <div class="bg-red-50 rounded-xl p-6 border border-red-100 text-left">
        <p class="text-slate-700 leading-relaxed mb-3">
            Your account has been temporarily deactivated.
        </p>
        <p class="text-slate-600 text-sm">
            This may be due to security reasons, policy violations, or pending verification.
        </p>
    </div>

    <div class="space-y-3">
        <a href="{% url 'accounts:signin' %}"
           class="w-full flex justify-center py-3.5 px-4 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition">
            Go to Login
        </a>

        <a href="#"
           class="block text-sm text-slate-500 hover:text-indigo-600 transition">
            Contact Support
        </a>
    </div>

</div>

</body>
</html>
