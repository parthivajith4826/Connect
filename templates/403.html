<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>403 – Forbidden</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
        <style>
            body {
                font-family: "Inter", sans-serif;
            }

            /* Custom Animations */
            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            @keyframes float {
                0% {
                    transform: translateY(0px);
                }
                50% {
                    transform: translateY(-10px);
                }
                100% {
                    transform: translateY(0px);
                }
            }
            @keyframes pulse-soft {
                0% {
                    box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.4);
                }
                70% {
                    box-shadow: 0 0 0 20px rgba(45, 212, 191, 0);
                }
                100% {
                    box-shadow: 0 0 0 0 rgba(45, 212, 191, 0);
                }
            }

            .animate-fade-up {
                animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
                opacity: 0;
            }
            .animate-float {
                animation: float 6s ease-in-out infinite;
            }
            .delay-100 {
                animation-delay: 0.1s;
            }
            .delay-200 {
                animation-delay: 0.2s;
            }
            .delay-300 {
                animation-delay: 0.3s;
            }
        </style>
    </head>
    <body class="bg-white h-screen flex flex-col items-center justify-center p-4">
        <!-- Content Container -->
        <div class="text-center max-w-lg mx-auto">
            <!-- Icon / Logo Area -->
            <div class="animate-fade-up mb-8 flex justify-center">
                <div
                    class="w-24 h-24 bg-[#00c4cc] rounded-full flex items-center justify-center text-white shadow-xl animate-float relative"
                >
                    <!-- Pulse Effect Ring -->
                    <div class="absolute inset-0 rounded-full animate-[pulse-soft_3s_infinite]"></div>

                    <!-- Lock Icon -->
                    <svg
                        class="w-10 h-10 relative z-10"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                        stroke-width="2"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                        ></path>
                    </svg>
                </div>
            </div>

            <!-- Title -->
            <h1 class="text-4xl font-bold text-slate-900 mb-4 tracking-tight animate-fade-up delay-100">Forbidden (403)</h1>

            <!-- Subtitle -->
            <p class="text-slate-500 text-lg mb-10 animate-fade-up delay-200">
                Sorry, you cannot access this page because you don't have an active subscription.
            </p>

            <!-- Action Button -->
            <div class="animate-fade-up delay-300">
                <a
                    href="{% url 'freelancer:subscriptions' %}"
                    class="inline-flex items-center px-8 py-3.5 rounded-full bg-[#7D2AE8] text-white font-semibold text-sm hover:bg-[#6821c2] hover:scale-105 transition-all duration-300 shadow-lg hover:shadow-xl hover:shadow-[#7D2AE8]/20 group"
                >
                    <span>View Subscription Plans</span>
                    <svg
                        class="w-4 h-4 ml-2 group-hover:translate-x-1 transition-transform"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M13 7l5 5m0 0l-5 5m5-5H6"
                        ></path>
                    </svg>
                </a>
            </div>
        </div>
    </body>
</html>
