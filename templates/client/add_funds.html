{% extends 'client/client_base.html' %} {% block wallet %}
<main class="flex-1 overflow-y-auto h-screen bg-slate-50 font-inter">
    <!-- Standard Header -->
    <header class="bg-white border-b border-black/5 h-16 px-8 flex items-center justify-between sticky top-0 z-10">
        <h1 class="text-xl font-bold text-slate-800">Add Funds</h1>
        <div class="flex items-center gap-3">
            <img
                src="{{ user.profile_photo.url }}"
                alt="Profile"
                class="w-8 h-8 rounded-full border border-black/5 object-cover"
            />
            <span class="font-medium text-slate-700 hidden md:block">{{ user.Profile_name }}</span>
        </div>
    </header>

    <div class="max-w-xl mx-auto px-6 py-12">
        <div class="bg-white rounded-sm border border-black/5 shadow-sm overflow-hidden flex flex-col md:flex-row">
            <!-- Illustration / Info Side -->
            <div class="bg-slate-50 p-8 md:w-2/5 flex flex-col justify-between border-r border-black/5">
                <div>
                    <h2 class="text-lg font-bold text-slate-800 mb-2">Top Up Wallet</h2>
                    <p class="text-xs text-slate-500 leading-relaxed">
                        Securely add funds to your account. Your balance will be updated instantly after payment.
                    </p>
                </div>
                <div class="mt-8 flex justify-center">
                    <svg class="w-24 h-24 text-indigo-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="1"
                            d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"
                        ></path>
                    </svg>
                </div>
            </div>

            <!-- Form Side -->
            <div class="p-8 md:w-3/5">
                {% if error %}
                <div
                    class="mb-6 p-3 rounded-sm bg-red-50 border border-red-100 text-red-600 text-xs flex items-center gap-2"
                >
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                        ></path>
                    </svg>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form method="post" action="" class="space-y-6">
                    {% csrf_token %}

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5 uppercase tracking-wide"
                            >Enter Amount</label
                        >
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 font-medium"
                                >₹</span
                            >
                            <input
                                type="number"
                                name="amount"
                                placeholder="0.00"
                                required
                                class="w-full pl-8 pr-4 py-2 text-sm border border-slate-300 rounded-sm focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 placeholder-slate-300 transition-colors"
                            />
                        </div>
                        <p class="text-[10px] text-slate-400 mt-1.5 text-right">Minimum amount: ₹50.00</p>
                    </div>

                    <div class="space-y-3 pt-2">
                        <button
                            type="submit"
                            class="w-full px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-sm shadow-sm transition-all focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                        >
                            Continue to Payment
                        </button>

                        <a href="{% url 'client:wallet' %}" class="block w-full">
                            <button
                                type="button"
                                class="w-full px-4 py-2.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-sm transition-colors"
                            >
                                Cancel
                            </button>
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
