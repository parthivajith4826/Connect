{% extends 'client/client_base.html' %}
{% block wallet %}

<main class="flex-1 overflow-y-auto h-screen">
    <!-- Topbar -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8 sticky top-0 z-10">
        <h1 class="text-xl font-bold text-slate-800">Add Funds</h1>

        <div class="flex items-center gap-3">
            <img
                src="{{ user.profile_photo.url }}"
                alt="Profile"
                class="w-8 h-8 rounded-full"
            />
            <span class="font-medium text-slate-700">
                {{ user.Profile_name }}
            </span>
        </div>
    </header>

    <!-- Content -->
    <div class="p-8 max-w-2xl mx-auto">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8">

            <h2 class="text-2xl font-bold text-slate-900 mb-2">
                Top up your wallet
            </h2>
            <p class="text-slate-500 mb-6">
                Enter the amount you want to add to your wallet.
            </p>

            {% if error %}
                <div class="mb-4 p-3 rounded-lg bg-red-100 text-red-700 text-sm">
                    {{ error }}
                </div>
            {% endif %}

            <form method="post" action = '' class="space-y-6">
                {% csrf_token %}

                <!-- Amount Input -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Amount
                    </label>

                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 text-lg">
                            ₹
                        </span>
                        <input
                            type="number"
                            name="amount"
                            {% comment %} min="2" {% endcomment %}
                            placeholder="Enter amount"
                            required
                            class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 text-lg"
                        />
                    </div>
                </div>

                <!-- Buttons -->
                <div class="flex items-center gap-4 pt-4">
                    <button
                        type="submit"
                        class="px-6 py-3 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition-colors shadow-sm"
                    >
                        Continue to Payment
                    </button>

                    <a
                        href="{% url 'client:wallet' %}"
                        class="px-6 py-3 border border-slate-300 text-slate-700 rounded-xl font-medium hover:bg-slate-50 transition-colors"
                    >
                        Cancel
                    </a>
                </div>
            </form>

        </div>
    </div>
</main>

{% endblock %}
