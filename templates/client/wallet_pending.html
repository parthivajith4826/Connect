{% extends 'client/client_base.html' %} {% block wallet %}
<main class="flex-1 overflow-hidden h-screen bg-slate-50 font-inter relative flex flex-col">
    <!-- Standard Header -->
    <header
        class="bg-white border-b border-black/5 h-16 px-8 flex items-center justify-between sticky top-0 z-10 flex-shrink-0"
    >
        <h1 class="text-xl font-bold text-slate-800">Payment Status</h1>
        <div class="flex items-center gap-3">
            <img
                src="{{ user.profile_photo.url }}"
                alt="Profile"
                class="w-8 h-8 rounded-full border border-black/5 object-cover"
            />
            <span class="font-medium text-slate-700 hidden md:block">{{ user.Profile_name }}</span>
        </div>
    </header>

    <!-- Content Container with Pattern -->
    <div class="flex-1 relative flex items-center justify-center p-6 overflow-hidden">
        <!-- Background Pattern -->
        <div class="absolute inset-0 pattern-dots opacity-40 pointer-events-none"></div>
        <!-- Decorative blobs -->
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-200 rounded-full blur-3xl opacity-20 animate-blob"></div>
        <div
            class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-200 rounded-full blur-3xl opacity-20 animate-blob animation-delay-2000"
        ></div>

        <div
            class="bg-white/80 backdrop-blur-md rounded-sm border border-white/50 shadow-lg p-10 text-center relative max-w-sm w-full mx-auto"
        >
            <div class="relative z-10 flex flex-col items-center">
                <!-- Advanced Spinner Animation -->
                <div class="relative w-24 h-24 mb-6">
                    <svg
                        class="animate-spin text-indigo-100"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle>
                    </svg>
                    <svg
                        class="animate-spin absolute top-0 left-0 text-indigo-600"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        style="animation-direction: reverse; animation-duration: 3s"
                    >
                        <path
                            d="M12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        ></path>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <svg
                            class="w-8 h-8 text-indigo-600 animate-pulse"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                            ></path>
                        </svg>
                    </div>
                </div>

                <h2 class="text-xl font-bold text-slate-800 mb-2">Processing Payment</h2>
                <p class="text-sm text-slate-500 mb-6 leading-relaxed">
                    We are verifying your transaction securely.<br />This usually takes just a few seconds.
                </p>

                <!-- Indeterminate Progress Bar -->
                <div class="w-full bg-slate-100 rounded-full h-1.5 mb-3 overflow-hidden">
                    <div class="bg-indigo-600 h-1.5 rounded-full animate-progress-indeterminate w-1/3"></div>
                </div>

                <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wide">Secure 256-bit SSL Encryption</p>
            </div>
        </div>
    </div>
</main>

<style>
    .pattern-dots {
        background-color: #f8fafc;
        background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
        background-size: 24px 24px;
    }

    @keyframes progress-indeterminate {
        0% {
            transform: translateX(-100%);
        }
        50% {
            transform: translateX(100%);
            width: 50%;
        }
        100% {
            transform: translateX(300%);
        }
    }
    .animate-progress-indeterminate {
        animation: progress-indeterminate 1.5s infinite linear;
    }

    @keyframes blob {
        0% {
            transform: translate(0px, 0px) scale(1);
        }
        33% {
            transform: translate(30px, -50px) scale(1.1);
        }
        66% {
            transform: translate(-20px, 20px) scale(0.9);
        }
        100% {
            transform: translate(0px, 0px) scale(1);
        }
    }
    .animate-blob {
        animation: blob 7s infinite;
    }
    .animation-delay-2000 {
        animation-delay: 2s;
    }
</style>

<script>
    setTimeout(() => location.reload(), 3000);
</script>
{% endblock %}
