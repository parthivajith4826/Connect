{% extends 'client/client_base.html' %} {% block wallet %}
<main class="flex-1 overflow-hidden h-screen bg-slate-50 font-inter relative flex flex-col">
    <!-- Standard Header -->
    <header
        class="bg-white border-b border-black/5 h-16 px-8 flex items-center justify-between sticky top-0 z-10 flex-shrink-0"
    >
        <h1 class="text-xl font-bold text-slate-800">Payment Status</h1>
        <div class="flex items-center gap-3">
            <img
                src="{{ user.profile_photo.url }}"
                alt="Profile"
                class="w-8 h-8 rounded-full border border-black/5 object-cover"
            />
            <span class="font-medium text-slate-700 hidden md:block">{{ user.Profile_name }}</span>
        </div>
    </header>

    <!-- Content Container -->
    <div class="flex-1 relative flex items-center justify-center p-6 overflow-hidden">
        <!-- Background Pattern -->
        <div class="absolute inset-0 pattern-dots opacity-40 pointer-events-none"></div>
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-slate-200 rounded-full blur-3xl opacity-20 animate-blob"></div>
        <div
            class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-gray-200 rounded-full blur-3xl opacity-20 animate-blob animation-delay-2000"
        ></div>

        <div
            class="bg-white/80 backdrop-blur-md rounded-sm border border-white/50 shadow-lg p-10 text-center relative max-w-sm w-full mx-auto"
        >
            <div class="relative z-10 flex flex-col items-center">
                <!-- Canceled Icon -->
                <div class="w-20 h-20 mb-6 bg-slate-100 rounded-full flex items-center justify-center relative">
                    <svg
                        class="w-10 h-10 text-slate-500 animate-pulse-slow"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                        ></path>
                    </svg>
                    <div class="absolute inset-0 border-4 border-slate-50 rounded-full animate-ping-slow"></div>
                </div>

                <h2 class="text-xl font-bold text-slate-800 mb-2">Payment Cancelled</h2>
                <p class="text-sm text-slate-500 mb-8 leading-relaxed">
                    You have cancelled the transaction. No funds were deducted from your account.
                </p>

                <div class="space-y-3 w-full">
                    <a href="{% url 'client:add_fund' %}" class="block w-full">
                        <button
                            class="w-full px-4 py-3 bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold rounded-sm shadow-sm transition-all transform hover:scale-[1.02]"
                        >
                            Add Funds Again
                        </button>
                    </a>

                    <a href="{% url 'client:wallet' %}" class="block w-full">
                        <button
                            class="w-full px-4 py-3 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold rounded-sm transition-colors"
                        >
                            Return to Wallet
                        </button>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<style>
    .pattern-dots {
        background-color: #f8fafc;
        background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
        background-size: 24px 24px;
    }

    @keyframes pulse-slow {
        0%,
        100% {
            opacity: 1;
        }
        50% {
            opacity: 0.7;
        }
    }
    .animate-pulse-slow {
        animation: pulse-slow 2s ease-in-out infinite;
    }

    @keyframes ping-slow {
        0% {
            transform: scale(1);
            opacity: 0.5;
        }
        100% {
            transform: scale(1.5);
            opacity: 0;
        }
    }
    .animate-ping-slow {
        animation: ping-slow 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes blob {
        0% {
            transform: translate(0px, 0px) scale(1);
        }
        33% {
            transform: translate(30px, -50px) scale(1.1);
        }
        66% {
            transform: translate(-20px, 20px) scale(0.9);
        }
        100% {
            transform: translate(0px, 0px) scale(1);
        }
    }
    .animate-blob {
        animation: blob 7s infinite;
    }
    .animation-delay-2000 {
        animation-delay: 2s;
    }
</style>
{% endblock %}
