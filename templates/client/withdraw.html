{% extends "client/client_base.html" %}
{% block wallet %}

<main class="flex-1 p-8 max-w-xl mx-auto">
    <h2 class="text-2xl font-bold mb-6">Withdraw Funds</h2>

    {% if error %}
        <div class="mb-4 p-3 bg-red-100 text-red-700 rounded">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label class="block mb-2 font-medium">Amount</label>
        <input
            type="number"
            name="amount"
            step="0.01"
            class="w-full border rounded px-4 py-2 mb-4"
            placeholder="Enter amount"
            required
        />

        <button
            type="submit"
            class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold"
        >
            Request Withdrawal
        </button>
    </form>
</main>

{% endblock %}
